# Client authentication. The same rules as the official image, plus one:
# the superuser may open a replication connection with its password, so
# the backup container can take physical base backups (pg_basebackup) for
# point-in-time recovery. Used through hba_file in docker-compose.yml, so it
# also applies to databases created before this file existed.

# TYPE  DATABASE        USER            ADDRESS                 METHOD
local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust
local   replication     all                                     trust
host    replication     all             127.0.0.1/32            trust
host    replication     all             ::1/128                 trust
host    replication     postgres        all                     scram-sha-256
host    all             all             all                     scram-sha-256
