# Production-like stack: open http://localhost:8080
#
#   docker compose up -d --build
#   docker compose exec app php artisan migrate --force --seed
#
services:
  # nginx: serves the built SPA and forwards /api and /sanctum to PHP-FPM,
  # so the browser sees one origin (required for Sanctum cookie auth).
  web:
    build: ./frontend
    ports:
      - "8080:80"
    volumes:
      - ./backend/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  app:
    build: ./backend
    env_file: ./backend/.env
    volumes:
      # Uploaded matter files. Back this up together with the database.
      - storage:/var/www/html/storage/app
    environment: &laravel-env
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8080
      FRONTEND_URL: http://localhost:8080
      SANCTUM_STATEFUL_DOMAINS: localhost:8080
      SESSION_DOMAIN: localhost
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: ph_legal
      DB_USERNAME: ph_legal
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      CLAMAV_ENABLED: "true"
      CLAMAV_HOST: clamav
      OCR_ENABLED: "true"
      # Above the text-extraction job's 600 s limit, so long OCR jobs never run twice.
      REDIS_QUEUE_RETRY_AFTER: "900"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      clamav:
        condition: service_started

  # Sends reminders and emails, and extracts text from uploads for search
  # (so it needs the file storage too). Retries survive a crashed worker.
  queue:
    build: ./backend
    command: php artisan queue:work --tries=5 --backoff=60 --max-time=3600
    env_file: ./backend/.env
    environment: *laravel-env
    volumes:
      - storage:/var/www/html/storage/app
    restart: unless-stopped
    depends_on:
      - app

  # Virus scanner for uploads. It downloads its signature database on first
  # start (a few minutes) and keeps it updated; it needs about 1.5 GB of RAM.
  # Until it is ready, uploads are refused rather than stored unscanned.
  clamav:
    image: clamav/clamav:stable
    volumes:
      - clamavdata:/var/lib/clamav
    restart: unless-stopped

  # Runs deadlines:dispatch-reminders hourly and trust:reconcile nightly.
  scheduler:
    build: ./backend
    command: php artisan schedule:work
    env_file: ./backend/.env
    environment: *laravel-env
    restart: unless-stopped
    depends_on:
      - app

  # The superuser is for administration only. The app connects as the
  # ordinary role `ph_legal` (created by 10-app-role.sh), which keeps
  # PostgreSQL row-level security in force.
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ph_legal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_ROOT_PASSWORD:-change-me-root}
      APP_DB_USER: ph_legal
      APP_DB_PASSWORD: ${DB_PASSWORD:-change-me}
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./backend/docker/postgres/10-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ph_legal"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data

volumes:
  dbdata:
  redisdata:
  storage:
  clamavdata:
